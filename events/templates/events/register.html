<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    background:white;
    width:400px;
    padding:2rem;
    border-radius:12px;
    box-shadow:0 8px 25px rgba(0,0,0,0.08);
}

h2{
    text-align:center;
    margin-bottom:1.5rem;
    color:#333;
}

form p{
    margin-bottom:1rem;
}

label{
    display:block;
    margin-bottom:6px;
    color:#555;
    font-size:14px;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    outline:none;
    transition:0.2s;
}

input:focus{
    border-color:#4f46e5;
}

button{
    width:100%;
    padding:12px;
    background:#4f46e5;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
    margin-top:10px;
}

button:hover{
    background:#4338ca;
}

.errorlist{
    color:red;
    list-style:none;
    font-size:13px;
    margin-bottom:5px;
}

.success{
    background:#dcfce7;
    color:#166534;
    padding:12px;
    border-radius:8px;
    margin-bottom:15px;
    text-align:center;
}

</style>

</head>
<body>

<div class="container">

    <h2>Event Registration</h2>

    {% if success %}
        <div class="success">
            Registration successful!
        </div>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Register
        </button>

    </form>

</div>

</body>
</html>
